<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 170" role="img" aria-label="Electrical Automation Services, Inc. — Direct Hire and Training">
  <defs>
    <linearGradient id="easSilver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#d7dde2"/>
      <stop offset="0.55" stop-color="#aab3bb"/>
      <stop offset="0.8" stop-color="#eef1f3"/>
      <stop offset="1" stop-color="#9199a1"/>
    </linearGradient>
    <linearGradient id="easGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed14f"/>
      <stop offset="0.5" stop-color="#4aa32c"/>
      <stop offset="1" stop-color="#2c7d1b"/>
    </linearGradient>
    <linearGradient id="easText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#dfe4e8"/>
      <stop offset="1" stop-color="#aeb6bd"/>
    </linearGradient>
  </defs>

  <!-- Coil mark: alternating silver/green twisted bands -->
  <g transform="translate(14,8) skewX(-9)">
    <!-- top silver tail -->
    <rect x="52" y="0"   width="46" height="20" rx="10" fill="url(#easSilver)"/>
    <rect x="6"  y="22"  width="96" height="21" rx="10.5" fill="url(#easSilver)"/>
    <rect x="18" y="44"  width="96" height="21" rx="10.5" fill="url(#easGreen)"/>
    <rect x="6"  y="66"  width="96" height="21" rx="10.5" fill="url(#easGreen)"/>
    <rect x="18" y="88"  width="96" height="21" rx="10.5" fill="url(#easGreen)"/>
    <rect x="6"  y="110" width="96" height="21" rx="10.5" fill="url(#easSilver)"/>
    <!-- bottom silver tail -->
    <rect x="30" y="132" width="46" height="20" rx="10" fill="url(#easSilver)"/>
  </g>

  <!-- Divider -->
  <rect x="150" y="14" width="2.5" height="142" fill="#4aa32c" opacity="0.85"/>

  <!-- Wordmark -->
  <g font-family="'Archivo','Barlow Condensed',Arial,sans-serif" font-weight="800" letter-spacing="0.5">
    <text x="168" y="52"  font-size="42" fill="url(#easText)">ELECTRICAL</text>
    <text x="168" y="94"  font-size="42" fill="url(#easText)">AUTOMATION</text>
    <text x="168" y="136" font-size="42" fill="url(#easText)">SERVICES, INC.</text>
  </g>

  <!-- Tagline -->
  <g transform="translate(168,158)">
    <rect x="0" y="-4" width="34" height="2.5" fill="#4aa32c"/>
    <text x="44" y="0" font-family="'Barlow Condensed','Archivo',Arial,sans-serif" font-weight="700" font-size="21" letter-spacing="3" fill="#5cb336">DIRECT HIRE &#8226; TRAINING</text>
    <rect x="384" y="-4" width="34" height="2.5" fill="#4aa32c"/>
  </g>
</svg>
